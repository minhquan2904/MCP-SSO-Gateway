[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP SSO Gateway: OIDC sign-in, revocable personal tokens, static YAML authorization, and bearer-token introspection for nginx."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "authlib>=1.3.2",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Block real network at process level; unix sockets stay allowed because the
# asyncio event loop uses an AF_UNIX socketpair for its self-pipe.
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
