# MCP SSO Gateway: protected `kind: http_api` upstream.
#
# Include inside a protected `location ^~ <registry path>` AFTER setting the
# selected registry server and the original request URI, and BEFORE
# `proxy_pass`. The prefix must equal the registry entry's `path` exactly:
#
#     location ^~ /status/ {
#         set $mcp_gateway_server status-api;
#         set $mcp_gateway_original_uri $request_uri;
#         include /etc/nginx/snippets/mcp-gateway-http-api.conf;
#         set $status_upstream status:8000;
#         proxy_pass http://$status_upstream;
#     }
#
# Requires `mcp-gateway.locations.conf` in the same server (it defines
# `/_authz` and the named error locations) and a `resolver` when `proxy_pass`
# uses a variable.
#
# The upstream receives no credential: the client's personal token is dropped
# (blank `Authorization`, never an empty `Bearer`) and only the validated
# `X-MCP-Gateway-User` identity is forwarded. The gateway's upstream-token
# response header is never read here.

auth_request /_authz;
auth_request_set $mcp_gateway_user $upstream_http_x_mcp_gateway_user;

# 401/403 come from the gateway; any other auth subrequest outcome (404 unknown
# server, gateway down) surfaces as nginx 500.
error_page 401 = @mcp_gateway_unauthorized;
error_page 403 = @mcp_gateway_forbidden;
error_page 500 502 503 504 = @mcp_gateway_unavailable;

proxy_set_header Authorization "";
proxy_set_header X-MCP-Gateway-Server "";
proxy_set_header X-MCP-Gateway-Original-URI "";
proxy_set_header X-MCP-Gateway-User $mcp_gateway_user;
proxy_set_header X-MCP-Gateway-Upstream-Token "";

# Upstream responses never echo gateway-control headers to the public client.
proxy_hide_header X-MCP-Gateway-Server;
proxy_hide_header X-MCP-Gateway-Original-URI;
proxy_hide_header X-MCP-Gateway-User;
proxy_hide_header X-MCP-Gateway-Upstream-Token;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;
