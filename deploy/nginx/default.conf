# Production nginx server for the MCP SSO Gateway example deployment.
# Mounted at /etc/nginx/conf.d/default.conf by deploy/docker-compose.example.yml;
# the gateway snippets are mounted under /etc/nginx/snippets/.
#
# nginx terminates TLS itself, so bearer tokens and session cookies never cross
# the wire in plain text. Provide a certificate for gateway.example.com as
# tls.crt/tls.key in the mounted /etc/nginx/tls directory.

# Reject TLS handshakes for any name other than the public gateway host.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name gateway.example.com;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Docker's embedded DNS; variables in proxy_pass resolve per request so
    # nginx starts even while an upstream container is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /auth/ browser routes, the internal /_authz subrequest, introspection
    # denials, and the JSON 401/403/503 named locations.
    include /etc/nginx/snippets/mcp-gateway.locations.conf;

    # Registry server "echo" (kind: mcp, path /echo/). The gateway result
    # replaces the client's personal token with echo's own upstream bearer.
    location ^~ /echo/ {
        set $mcp_gateway_server echo;
        set $mcp_gateway_original_uri $request_uri;
        include /etc/nginx/snippets/mcp-gateway-mcp.conf;
        set $echo_upstream echo:8000;
        proxy_pass http://$echo_upstream/mcp;
    }

    # Registry server "status-api" (kind: http_api, path /status/). The
    # upstream receives a blank Authorization and only the validated user.
    location ^~ /status/ {
        set $mcp_gateway_server status-api;
        set $mcp_gateway_original_uri $request_uri;
        include /etc/nginx/snippets/mcp-gateway-http-api.conf;
        set $status_upstream status:8000;
        proxy_pass http://$status_upstream;
    }

    # Every other path, including all other gateway endpoints, is not routed.
    location / {
        return 404;
    }
}
