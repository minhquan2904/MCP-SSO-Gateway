# MCP SSO Gateway: public routing contract.
#
# Include once inside the public TLS `server { ... }` block:
#
#     include /etc/nginx/snippets/mcp-gateway.locations.conf;
#
# This file defines only gateway-owned locations. It deliberately does not
# define `location /`: the operator's server owns the root location and MUST
# answer every path it does not explicitly route without proxying to the
# gateway (the reference production server config returns 404). The gateway is
# reachable publicly only through `/auth` and `/auth/`; every other gateway
# path (`/introspect`, `/healthz`, ...) is never proxied.
#
# Protected locations include `mcp-gateway-mcp.conf` or
# `mcp-gateway-http-api.conf`; those rely on `/_authz` and the named error
# locations defined here.
#
# The gateway hostname `gateway:8000` is resolved per request through the
# Docker embedded DNS server, so nginx starts even while the gateway is down.

# Browser sign-in entry point (GET /auth). Shares the `/auth/` contract below.
location = /auth {
    resolver 127.0.0.11 valid=10s ipv6=off;
    if ($request_method !~ ^(?:GET|HEAD|POST)$) {
        return 404;
    }
    set $mcp_gateway_upstream gateway:8000;
    proxy_pass http://$mcp_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header X-MCP-Gateway-Server "";
    proxy_set_header X-MCP-Gateway-Original-URI "";
    proxy_set_header X-MCP-Gateway-User "";
    proxy_set_header X-MCP-Gateway-Upstream-Token "";
    proxy_hide_header X-MCP-Gateway-Server;
    proxy_hide_header X-MCP-Gateway-Original-URI;
    proxy_hide_header X-MCP-Gateway-User;
    proxy_hide_header X-MCP-Gateway-Upstream-Token;
    client_max_body_size 16k;
}

# Browser token UI: sign-in callback, token issue/revoke, server catalog, logout.
# Only the methods the gateway implements are proxied; everything else is 404.
# Raw paths carrying encoded separators, dot segments, or doubled slashes are
# refused so the gateway never sees a path that nginx and Starlette could
# interpret differently.
location ^~ /auth/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    if ($request_method !~ ^(?:GET|HEAD|POST)$) {
        return 404;
    }
    if ($request_uri ~* "^[^?]*(?:%2e|%2f|%5c|\x5c|//|/\.)") {
        return 404;
    }
    set $mcp_gateway_upstream gateway:8000;
    proxy_pass http://$mcp_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header X-MCP-Gateway-Server "";
    proxy_set_header X-MCP-Gateway-Original-URI "";
    proxy_set_header X-MCP-Gateway-User "";
    proxy_set_header X-MCP-Gateway-Upstream-Token "";
    proxy_hide_header X-MCP-Gateway-Server;
    proxy_hide_header X-MCP-Gateway-Original-URI;
    proxy_hide_header X-MCP-Gateway-User;
    proxy_hide_header X-MCP-Gateway-Upstream-Token;
    client_max_body_size 16k;
}

# Auth subrequest target. `internal` makes direct client requests return 404.
# Forwards only the client bearer plus the server/URI pair that the protected
# location set; never the client's own gateway headers, cookies, or body.
location = /_authz {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_gateway_upstream gateway:8000;
    proxy_pass http://$mcp_gateway_upstream/introspect;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header X-MCP-Gateway-Server $mcp_gateway_server;
    proxy_set_header X-MCP-Gateway-Original-URI $mcp_gateway_original_uri;
    proxy_set_header X-MCP-Gateway-User "";
    proxy_set_header X-MCP-Gateway-Upstream-Token "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

# Public spellings of the introspection and subrequest paths. nginx decodes
# percent-escapes and merges slashes before location matching, so `/introspect`,
# `/introspect/`, `/introspect;x`, `//introspect`, and `/%69ntrospect` all hit a
# prefix below; the regex also covers servers that disable `merge_slashes` and
# mixed-case variants. All methods return 404 without proxying.
location ^~ /introspect {
    return 404;
}
location ^~ /_authz/ {
    return 404;
}
location ~* "^/+(?:introspect|_authz)(?:[/;]|$)" {
    return 404;
}

# JSON error bodies for MCP clients. Protected snippets route auth failures here.
location @mcp_gateway_unauthorized {
    default_type application/json;
    add_header WWW-Authenticate 'Bearer realm="mcp-gateway"' always;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"unauthorized","how_to_fix":"Send a valid personal token as \'Authorization: Bearer <token>\'; issue a new one at /auth/token."}\n';
}
location @mcp_gateway_forbidden {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":"forbidden","how_to_fix":"Ask an administrator for access to this server."}\n';
}
location @mcp_gateway_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"unavailable","how_to_fix":"The gateway could not authorize this request; retry later or contact an administrator."}\n';
}
