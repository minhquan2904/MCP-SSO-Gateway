server {
    listen 8080;
    server_name _;

    # The probe has one public origin. Do not propagate client-provided proxy headers.
    location = /idp/realms/mcp-demo/protocol/openid-connect/auth {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /idp/realms/mcp-demo/protocol/openid-connect/logout {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ^~ /idp/realms/mcp-demo/login-actions/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ^~ /idp/resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /idp/realms/mcp-demo/.well-known/openid-configuration {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /idp/realms/mcp-demo/protocol/openid-connect/certs {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}
