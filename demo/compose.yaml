# Loopback-only HTTP demo. Plain HTTP and the non-Secure session cookie are
# demo-only; production ingress carrying sessions or bearer tokens must
# terminate TLS. Only nginx publishes a port, and only on 127.0.0.1.
#
# Networks follow the production model: authz (nginx + gateway),
# identity-provider (nginx + gateway + Keycloak), and one internal network per
# upstream shared only with nginx. Runtime secrets are generated by
# init-secrets and mounted per directory into the services that need them.
name: mcp-sso-gateway-demo

services:
  init-secrets:
    image: busybox:1.37.0
    entrypoint: ["/bin/sh", "/scripts/init-secrets.sh"]
    network_mode: none
    volumes:
      - ./init-secrets.sh:/scripts/init-secrets.sh:ro
      - bootstrap-admin:/run/secrets/bootstrap-admin
      - oidc-client:/run/secrets/oidc-client
      - gateway-session:/run/secrets/gateway-session
      - echo-token:/run/secrets/echo-token
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    entrypoint: ["/scripts/keycloak-entrypoint.sh"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: http://localhost:8080/idp
      KC_HOSTNAME_ADMIN: http://localhost:8080/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    depends_on:
      init-secrets: {condition: service_completed_successfully}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/mcp-demo-realm.json:ro
      - ./keycloak-entrypoint.sh:/scripts/keycloak-entrypoint.sh:ro
      - keycloak-data:/opt/keycloak/data
      - bootstrap-admin:/run/secrets/bootstrap-admin:ro
    networks: [identity-provider]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /idp/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; response=$$(cat <&3); [[ $$response == *\"status\"*\"UP\"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  init-keycloak-client:
    image: quay.io/keycloak/keycloak:26.1.4
    entrypoint: ["/scripts/init-keycloak-client.sh"]
    environment: {MCP_GATEWAY_PUBLIC_BASE_URL: http://localhost:8080}
    depends_on:
      keycloak: {condition: service_healthy}
    network_mode: service:keycloak
    volumes:
      - ./init-keycloak-client.sh:/scripts/init-keycloak-client.sh:ro
      - keycloak-data:/opt/keycloak/data
      - bootstrap-admin:/run/secrets/bootstrap-admin
      - oidc-client:/run/secrets/oidc-client:ro
  gateway:
    build: ..
    depends_on:
      init-keycloak-client: {condition: service_completed_successfully}
    read_only: true
    user: "1000:1000"
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      MCP_GATEWAY_OIDC_ISSUER: http://localhost:8080/idp/realms/mcp-demo
      MCP_GATEWAY_OIDC_DISCOVERY_URL: http://keycloak:8080/idp/realms/mcp-demo/.well-known/openid-configuration
      MCP_GATEWAY_ALLOW_INSECURE_OIDC: "true"
      MCP_GATEWAY_OIDC_CLIENT_ID: mcp-gateway
      MCP_GATEWAY_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-client/client-secret
      MCP_GATEWAY_SESSION_SECRET_FILE: /run/secrets/gateway-session/session-secret
      MCP_GATEWAY_PUBLIC_BASE_URL: http://localhost:8080
      MCP_GATEWAY_REGISTRY_FILE: /etc/mcp-gateway/registry.yaml
      MCP_GATEWAY_POLICY_FILE: /etc/mcp-gateway/policy.yaml
      MCP_GATEWAY_DATA_DIR: /data
      MCP_GATEWAY_SECRETS_DIR: /run/secrets
      MCP_GATEWAY_INTROSPECT_CALLERS: nginx
    volumes:
      - ./registry.yaml:/etc/mcp-gateway/registry.yaml:ro
      - ./policy.yaml:/etc/mcp-gateway/policy.yaml:ro
      - gateway-data:/data
      - oidc-client:/run/secrets/oidc-client:ro
      - gateway-session:/run/secrets/gateway-session:ro
      - echo-token:/run/secrets/echo-token:ro
    networks: [authz, identity-provider]
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  echo:
    image: python:3.12.11-slim-bookworm
    command: ["python", "/app/mock_mcp.py"]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment: {ECHO_TOKEN_FILE: /run/secrets/echo-token/token, PYTHONDONTWRITEBYTECODE: "1"}
    volumes:
      - ./mock_mcp.py:/app/mock_mcp.py:ro
      - echo-token:/run/secrets/echo-token:ro
    networks: [echo-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  status:
    image: python:3.12.11-slim-bookworm
    command: ["python", "/app/mock_mcp.py"]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment: {STATUS_MODE: "true", PYTHONDONTWRITEBYTECODE: "1"}
    volumes: [./mock_mcp.py:/app/mock_mcp.py:ro]
    networks: [status-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    image: nginx:1.27.5-alpine
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      gateway: {condition: service_healthy}
      init-keycloak-client: {condition: service_completed_successfully}
      echo: {condition: service_healthy}
      status: {condition: service_healthy}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../deploy/nginx/mcp-gateway.locations.conf:/etc/nginx/snippets/mcp-gateway.locations.conf:ro
      - ../deploy/nginx/mcp-gateway-mcp.conf:/etc/nginx/snippets/mcp-gateway-mcp.conf:ro
      - ../deploy/nginx/mcp-gateway-http-api.conf:/etc/nginx/snippets/mcp-gateway-http-api.conf:ro
      - ./idp-headers.conf:/etc/nginx/snippets/idp-headers.conf:ro
    networks: [edge, authz, identity-provider, echo-net, status-net]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Published-port network; only nginx joins it.
  edge: {}
  # nginx <-> gateway only: /auth proxying and the /_authz subrequest.
  authz: {internal: true}
  # nginx (public browser allowlist) and gateway (private discovery/token/JWKS).
  identity-provider: {internal: true}
  # One internal network per upstream, shared only with nginx.
  echo-net: {internal: true}
  status-net: {internal: true}
volumes:
  keycloak-data: {}
  bootstrap-admin: {}
  oidc-client: {}
  gateway-session: {}
  echo-token: {}
  gateway-data: {}
