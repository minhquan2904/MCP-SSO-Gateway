# Local HTTP is intentionally demo-only. Only nginx publishes a loopback port.
server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Share the production auth, introspection denial, and credential-swap rules.
    include /etc/nginx/snippets/mcp-gateway.locations.conf;

    # Health is public for the smoke probe, never an authorization bypass for MCP.
    location = /echo/healthz {
        set $echo_upstream echo:8000;
        proxy_pass http://$echo_upstream/healthz;
        proxy_set_header Authorization "";
        proxy_set_header X-MCP-Gateway-Server "";
        proxy_set_header X-MCP-Gateway-Original-URI "";
        proxy_set_header X-MCP-Gateway-User "";
        proxy_set_header X-MCP-Gateway-Upstream-Token "";
        proxy_hide_header X-MCP-Gateway-Server;
        proxy_hide_header X-MCP-Gateway-Original-URI;
        proxy_hide_header X-MCP-Gateway-User;
        proxy_hide_header X-MCP-Gateway-Upstream-Token;
    }

    location ^~ /echo/ {
        set $mcp_gateway_server echo;
        set $mcp_gateway_original_uri $request_uri;
        include /etc/nginx/snippets/mcp-gateway-mcp.conf;
        set $echo_upstream echo:8000;
        proxy_pass http://$echo_upstream/mcp;
    }

    location ^~ /status/ {
        set $mcp_gateway_server status;
        set $mcp_gateway_original_uri $request_uri;
        include /etc/nginx/snippets/mcp-gateway-http-api.conf;
        set $status_upstream status:8000;
        proxy_pass http://$status_upstream;
    }

    # Public browser-only Keycloak allowlist; its admin and token APIs remain
    # unavailable through nginx. The gateway uses private discovery instead.
    location = /idp/realms/mcp-demo/protocol/openid-connect/auth { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }
    location = /idp/realms/mcp-demo/protocol/openid-connect/logout { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }
    location ^~ /idp/realms/mcp-demo/login-actions/ { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }
    location ^~ /idp/resources/ { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }
    location = /idp/realms/mcp-demo/.well-known/openid-configuration { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }
    location = /idp/realms/mcp-demo/protocol/openid-connect/certs { set $keycloak keycloak:8080; proxy_pass http://$keycloak; include /etc/nginx/snippets/idp-headers.conf; }

    location / { return 404; }
}
