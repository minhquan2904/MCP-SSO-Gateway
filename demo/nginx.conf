# nginx for the demo. `/echo/` and `/echo2/` point at the same upstream but are
# two servers in policy.yaml: alice may use the first and not the second.

server {
    listen 8080;

    # Docker's embedded DNS. Upstreams go through variables so names are
    # re-resolved: a recreated container keeps its name, not its address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── the check, as a subrequest ───────────────────────────────────────
    location = /_authz {
        internal;
        set $gateway "gateway:8000";
        proxy_pass http://$gateway/introspect;

        # auth_request sends no body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Set here from the location, never from the client.
        proxy_set_header X-MCP-Gateway-Server $mcp_server;

        # Gateway down means denied, and quickly.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # auth_request keeps only the status, so give MCP clients a JSON body they
    # can show to the user instead of an nginx HTML page.
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized","how_to_fix":"Token is wrong, expired or revoked. Issue a new one."}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"error":"forbidden","how_to_fix":"Your account is not allowed on this server. Ask an admin."}';
    }

    # ── health check: no auth, so strip what auth would have replaced ─────
    location = /echo/healthz {
        proxy_set_header Authorization "";
        proxy_set_header X-MCP-Gateway-User "";
        set $upstream "echo:8000";
        proxy_pass http://$upstream/healthz;
    }

    # ── protected servers ────────────────────────────────────────────────
    # `^~` so no regex location can take these paths and skip auth_request.
    location ^~ /echo/ {
        set $mcp_server "echo";
        include /etc/nginx/snippets/protect.conf;
        set $upstream "echo:8000";
        rewrite ^/echo/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location ^~ /echo2/ {
        set $mcp_server "echo2";
        include /etc/nginx/snippets/protect.conf;
        set $upstream "echo:8000";
        rewrite ^/echo2/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
}
