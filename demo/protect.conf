# Included by every protected location. The location sets $mcp_server first.

auth_request /_authz;
error_page 401 = @unauthorized;
error_page 403 = @forbidden;

auth_request_set $gateway_user  $upstream_http_x_mcp_gateway_user;
auth_request_set $gateway_token $upstream_http_x_mcp_gateway_upstream_token;

# Token exchange: the upstream gets its own static token, never the user's.
proxy_set_header Authorization "Bearer $gateway_token";
proxy_set_header X-MCP-Gateway-User $gateway_user;

# Streamable HTTP / SSE.
proxy_http_version 1.1;
proxy_buffering off;
proxy_read_timeout 3600s;
